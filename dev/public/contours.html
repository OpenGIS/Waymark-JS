    <div id="map"></div>
    <script>
      const TERRARIUM_URL =
        "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";

      const terrainSource = {
        type: "raster-dem",
        tiles: [TERRARIUM_URL],
        encoding: "terrarium",
        tileSize: 256,
        maxzoom: 14,
      };

      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/bright",
        //mtb_scale example:
        //center: [10.52302507, 55.0952585],
        //mtb:scale:imba example:
        center: [-125.022417, 49.607406],
        zoom: 15,
        pitch: 0,
        bearing: 0,
      });

      map.on("style.load", () => {
        // MTB trail highlighting (openfreemap/openmaptiles mtb_scale)
        // Placed before highway-name-path so it renders above road paint but below labels
        map.addLayer(
          {
            id: "mtb_scale-casing",
            type: "line",
            source: "openmaptiles",
            "source-layer": "transportation",
            filter: [
              "all",
              ["==", "$type", "LineString"],
              ["!=", "brunnel", "tunnel"],
              ["has", "mtb_scale"],
            ],
            layout: {
              "line-cap": "round",
              "line-join": "round",
            },
            paint: {
              "line-color": [
                "match",
                ["get", "mtb_scale"],
                "1",
                "blue",
                "2",
                "red",
                "black",
              ],
              "line-opacity": [
                "interpolate",
                ["linear"],
                ["zoom"],
                13,
                0,
                16,
                1,
              ],
              "line-width": [
                "interpolate",
                ["exponential", 1.2],
                ["zoom"],
                12,
                0.5,
                16,
                3,
              ],
            },
          },
          "highway-name-path",
        );
