<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapLibre Contour Lines Demo</title>
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-contour@latest/dist/index.min.js"></script>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
      }
      #map {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const TERRARIUM_URL =
        "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";

      const terrainSource = {
        type: "raster-dem",
        tiles: [TERRARIUM_URL],
        encoding: "terrarium",
        tileSize: 256,
        maxzoom: 14,
      };

      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/bright",

        // Skovhuggeren mtb_scale example:
        // center: [10.52302507, 55.0952585],

        // Cumberland mtb:scale:imba example:
        // center: [-125.022417, 49.607406],

        // Pove del Grappa 45.821142,11.7373742
        center: [11.7373742, 45.824042],

        zoom: 12.3,
        pitch: 0,
        bearing: 0,
      });

      map.on("style.load", () => {
        // === Terrain & hillshade ===
        map.addSource("terrainSource", terrainSource);
        map.setTerrain({
          source: "terrainSource",
          exaggeration: 1.5,
        });

        // Softer hillshade so contour lines remain legible
        map.addLayer({
          id: "hillshade-layer",
          type: "hillshade",
          source: "terrainSource",
          paint: {
            "hillshade-exaggeration": 0.35,
          },
        });

        // === Contours ===
        const demSource = new mlcontour.DemSource({
          url: TERRARIUM_URL,
          encoding: "terrarium",
          maxzoom: 13,
          worker: true,
          cacheSize: 100,
          timeoutMs: 10000,
        });
        demSource.setupMaplibre(maplibregl);
        map.addSource("contour-source", {
          type: "vector",
          minzoom: 10,
          tiles: [
            demSource.contourProtocolUrl({
              thresholds: {
                0: [100, 500],
                5: [50, 250],
                10: [25, 100],
                15: [10, 50],
              },
              contourLayer: "contours",
              elevationKey: "ele",
              levelKey: "level",
              extent: 4096,
              buffer: 1,
            }),
          ],
          maxzoom: 15,
        });

        // Regular contour lines — subtle warm grey, fade in gradually with zoom
        map.addLayer({
          id: "contour-lines",
          type: "line",
          source: "contour-source",
          "source-layer": "contours",
          minzoom: 10,
          filter: ["==", ["get", "level"], 0],
          paint: {
            "line-color": "hsl(35, 5%, 55%)",
            "line-opacity": [
              "interpolate",
              ["linear"],
              ["zoom"],
              10,
              0,
              14,
              0.2,
              18,
              0.35,
            ],
            "line-width": [
              "interpolate",
              ["linear"],
              ["zoom"],
              10,
              0.3,
              18,
              0.8,
            ],
          },
        });

        // Index contour lines (every Nth) — slightly darker, wider, higher opacity
        map.addLayer({
          id: "contour-lines-index",
          type: "line",
          source: "contour-source",
          "source-layer": "contours",
          minzoom: 10,
          filter: [">", ["get", "level"], 0],
          paint: {
            "line-color": "hsl(35, 5%, 45%)",
            "line-opacity": [
              "interpolate",
              ["linear"],
              ["zoom"],
              10,
              0,
              14,
              0.3,
              18,
              0.5,
            ],
            "line-width": [
              "interpolate",
              ["linear"],
              ["zoom"],
              10,
              0.5,
              18,
              1.5,
            ],
          },
        });

        // Contour elevation labels — only on index lines, map-aligned, subtle
        map.addLayer({
          id: "contour-labels",
          type: "symbol",
          source: "contour-source",
          "source-layer": "contours",
          minzoom: 11,
          filter: [">", ["get", "level"], 0],
          layout: {
            "symbol-placement": "line",
            "symbol-avoid-edges": true,
            "text-rotation-alignment": "map",
            "text-size": ["interpolate", ["linear"], ["zoom"], 12, 9, 18, 13],
            "text-field": [
              "concat",
              ["number-format", ["get", "ele"], {}],
              "m",
            ],
            "text-font": ["Noto Sans Regular"],
            "text-padding": 10,
          },
          paint: {
            "text-color": "hsl(35, 5%, 40%)",
            "text-halo-color": "hsla(0, 0%, 100%, 0.7)",
            "text-halo-width": 1.5,
          },
        });

        // MTB trail highlighting (openfreemap/openmaptiles mtb_scale)
        // Placed before highway-name-path so it renders above road paint but below labels
        map.addLayer(
          {
            id: "mtb_scale-casing",
            type: "line",
            source: "openmaptiles",
            "source-layer": "transportation",
            filter: [
              "all",
              ["==", "$type", "LineString"],
              ["!=", "brunnel", "tunnel"],
              ["has", "mtb_scale"],
            ],
            layout: {
              "line-cap": "round",
              "line-join": "round",
            },
            paint: {
              "line-color": [
                "match",
                ["get", "mtb_scale"],
                "1",
                "blue",
                "2",
                "red",
                "black",
              ],
              "line-opacity": [
                "interpolate",
                ["linear"],
                ["zoom"],
                13,
                0,
                16,
                1,
              ],
              "line-width": [
                "interpolate",
                ["exponential", 1.2],
                ["zoom"],
                12,
                0.5,
                16,
                3,
              ],
            },
          },
          "highway-name-path",
        );
      });
    </script>
  </body>
</html>
